<!doctype html>
<!-- `dark` is applied here, not toggled at runtime: the app is dark-only by
     design (tauri.conf.json sets theme "Dark" and a #0d1117 window
     background). Without it, index.css's :root light palette wins and every
     shadcn component using theme tokens -- bg-popover, text-foreground --
     renders white against the app's own hardcoded dark colours. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the page paint into the notch and
         home-indicator strips instead of being letterboxed inside the
         safe area, which is what leaves grey bars around a Tauri
         webview on an iPhone. It is only half of the fix: it also lets
         content slide UNDER those strips, so the app's own shell pads
         itself with `env(safe-area-inset-*)` (see `index.css`). The two
         belong together -- either alone is a regression. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Headstate</title>
  </head>
  <body>
    <!-- Two sources, one <picture>, chosen by the browser before any
         JS runs. The alternative -- picking in `main.tsx` from
         `VITE_TARGET` -- would not work here: the splash has to be in
         the first paint, and `<body>` is empty until React mounts.

         The switch is on ORIENTATION rather than on the build, so a
         desktop window dragged tall gets the portrait art too. That is
         the right behaviour for what this is: a picture that has to
         fill whatever shape the window is. -->
    <div id="splash">
      <picture>
        <source srcset="/splash-mobile.png" media="(orientation: portrait)" />
        <img src="/splash.png" alt="Headstate" />
      </picture>
    </div>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #0d1117; opacity: 1; transition: opacity 400ms ease;
      }
      /* `picture` is display:inline by default, so it needs to be told
         to fill the flex item; without this the img sizes against a
         zero-height box. */
      #splash picture { display: contents; }
      #splash img { width: 100%; height: 100%; object-fit: cover; }
      #splash.headstate-hiding { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
