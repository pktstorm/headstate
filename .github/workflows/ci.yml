name: CI

on:
  push:
    branches: [main]
    # Tags too: `release.yml` runs no tests of its own, and a tag ref is
    # neither a branch push nor a pull request -- so without this, tagging
    # published a build that nothing had linted, type-checked, or tested.
    tags: ["v*"]
  pull_request:
  # The merge queue builds a temporary ref containing this pull request
  # ON TOP OF everything ahead of it, and waits for these same checks
  # against THAT tree. Without this trigger the queue would wait
  # forever for checks that never run, and every merge would hang.
  #
  # This is what makes the queue worth having: `strict` status checks
  # guarantee a PR was tested against main as it was, and the queue
  # guarantees it was tested against main as it WILL BE -- including
  # alongside the other PRs merging with it. Two green PRs that have
  # never been compiled together is the failure neither a rebase nor a
  # clean git merge can catch.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag run: `release.yml` waits on it, and a cancelled
  # check would either block the release forever or wave it through.
  #
  # Merge-group runs are exempt for the same reason, one step removed:
  # the QUEUE waits on them, so a cancelled run leaves the entry stuck
  # until it times out and gets ejected -- which reads as a flaky merge
  # rather than a cancelled check.
  cancel-in-progress: >-
    ${{ !startsWith(github.ref, 'refs/tags/')
        && github.event_name != 'merge_group' }}

# Least privilege by default; jobs needing more say so themselves.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, not floating tags.
# A tag is mutable: whoever controls the action repo can repoint it at new
# code that then runs with this job's permissions. The trailing comment
# records which release each SHA is, since a bare SHA is unreadable.

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust-components: clippy, rustfmt
      - name: Privacy guard
        run: ./scripts/check-privacy.sh
      - name: Workflow shells
        run: python3 scripts/check-workflow-shells.py
      # Asked BEFORE the heavy jobs, and asked at all because the ignore
      # rule alone cannot enforce this. A committed symlink whose target
      # is absolute or climbs out of the tree resolves only on the
      # machine that made it -- so it passes every local run and fails
      # every runner. The #813 instance took out nine of ten jobs with
      # `ENOTDIR ... mkdir node_modules`, named a different package each
      # run so it read as a flaky registry fetch, and got one wrong fix
      # shipped (#811) before anyone looked at the index.
      - name: Committed symlinks
        run: |
          python3 scripts/check-symlinks.test.py
          python3 scripts/check-symlinks.py
      # The mobile jobs skip their own steps when nothing mobile changed.
      # The failure mode of getting that wiring wrong is a job that
      # reports green having compiled nothing, forever -- so it is
      # checked here, in a job that always runs, rather than trusted to
      # review. See the `mobile-changes` job.
      - name: Mobile path gate
        run: python3 scripts/check-mobile-gate.py
      # Asserted against the SOURCE css, unlike the toast check below which
      # needs a built bundle. This rule is hand-written and survives the
      # build unchanged, and the test suite structurally cannot see it:
      # jsdom applies no stylesheets, `?raw` returns empty because
      # @tailwindcss/vite claims .css, and tests avoid node:fs. So removing
      # it makes keyboard focus invisible app-wide with everything green
      # (#690, #694).
      - name: Focus ring
        run: ./scripts/check-focus-css.sh
      # The same check `tauri build` makes at bundle time, asked here in
      # a second. Without it a JS/Rust Tauri mismatch passes every fast
      # job and fails from the slowest one (#555).
      - name: Tauri package versions
        run: |
          python3 scripts/check-tauri-versions.test.py
          python3 scripts/check-tauri-versions.py
          python3 scripts/android-release-signing.test.py
      # Both crates. `crates/headstate-stepup` is a PATH DEPENDENCY of
      # src-tauri rather than a workspace member, so a run from src-tauri
      # never looks at it -- and it is the one place the step-up
      # canonical bytes, header grammar and verifier now live (#695).
      - name: Rust formatting
        run: |
          (cd crates/headstate-stepup && cargo fmt --check)
          (cd src-tauri && cargo fmt --check)
      - name: Typecheck
        run: yarn tsc -b --force
      - name: ESLint
        run: yarn eslint .
      - name: Knip
        run: yarn knip
      - name: Clippy
        shell: bash
        run: |
          (cd crates/headstate-stepup && cargo clippy --all-targets -- -D warnings)
          (cd src-tauri && cargo clippy --all-targets -- -D warnings)

  test-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The shared step-up crate first: it is a path dependency, so
      # src-tauri's `cargo test` compiles it and runs none of its tests,
      # and everything below is meaningless if the protocol is broken.
      - name: Rust tests
        shell: bash
        run: |
          (cd crates/headstate-stepup && cargo test)
          (cd src-tauri && cargo test)
      # Tests share a process, so state-touching changes can fail
      # intermittently. One green run does not prove a race is absent, but
      # ten full re-runs on every push stopped being free once real tests
      # landed (26 Rust tests as of this writing). Three total re-runs is a
      # deliberate trade: still catches the class of bug that failed about
      # one run in seven in a sibling project, without paying for a fixed
      # guess of "ten" on every push and PR forever. Bump this back up (or
      # move it to a scheduled job) if flakiness shows up that three runs
      # doesn't catch.
      - name: Race check
        working-directory: src-tauri
        run: |
          for i in $(seq 1 3); do
            cargo test --lib -- --test-threads=8 || { echo "FAILED ON ITERATION $i"; exit 1; }
          done

  test-frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Frontend tests
        shell: bash
        run: yarn vitest run

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # A THROWAWAY key when the real one is unavailable.
      #
      # GitHub withholds repository secrets from workflows triggered by
      # a fork pull request, so `TAURI_SIGNING_PRIVATE_KEY` arrives
      # empty and `tauri build` refuses to bundle -- failing this job on
      # every outside contribution, including one that changed only the
      # README. A contributor cannot fix that from their branch.
      #
      # The key here only has to be VALID, not the real one: this job
      # builds a bundle to check it builds, runs check-toast-css.sh
      # against it, and discards it. Nothing is uploaded or published,
      # so a signature made here can never reach a user.
      #
      # The release is unaffected and cannot be: `release.yml` is a
      # separate workflow that reads the secret directly and HARD-FAILS
      # when it is missing ("updates would be unusable"), and tags are
      # cut from main, never from a fork. A throwaway key cannot reach
      # a published artifact through this path.
      - name: Provide a signing key when secrets are unavailable
        id: signing
        shell: bash
        env:
          REAL_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${REAL_KEY:-}" ]; then
            echo "key=$REAL_KEY" >> "$GITHUB_OUTPUT"
            echo "Using the repository signing key."
          else
            # `-p ''` makes a key with no password, matching the empty
            # password the build step passes.
            yarn tauri signer generate -w "$RUNNER_TEMP/ci.key" -p '' >/dev/null
            {
              echo "key<<KEYEOF"
              cat "$RUNNER_TEMP/ci.key"
              echo
              echo "KEYEOF"
            } >> "$GITHUB_OUTPUT"
            echo "No signing secret (fork pull request); generated a throwaway key."
          fi

      - name: Build the app bundle
        env:
          # Once `tauri.conf.json` carries an updater public key, `tauri
          # build` refuses to produce a bundle without a matching private
          # key -- "A public key has been found, but no private key".
          # Found by this very job failing on the updater PR.
          #
          # Signing in CI also means the bundle this job builds is the
          # same shape the release builds, rather than a variant that
          # only compiles here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing.outputs.key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: yarn tauri build --bundles app

      # Asserted against the BUILT css, because this failure exists only
      # in a production bundle: `yarn dev` does not extract Sonner's
      # inlined styles and jsdom applies them, so every other gate passes
      # while the shipped app renders toasts in document flow.
      - name: Check the toast overlay's styles survived the build
        shell: bash
        run: ./scripts/check-toast-css.sh

      # The release ships a UNIVERSAL binary, but this job builds native
      # arm64 only -- so an arch-gated link failure (plausible with bundled
      # SQLite or octocrab's crypto backends) passed every PR and would
      # first appear at tag time, after version stamping, during a release.
      #
      # `cargo check` rather than a second full build: it catches the
      # compile and link-configuration failures that differ by target
      # without doubling this job's runtime.
      - name: Check the Intel target the release also builds
        run: |
          rustup target add x86_64-apple-darwin
          cd src-tauri && cargo check --target x86_64-apple-darwin --all-targets

  supply-chain:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny
        working-directory: src-tauri
        run: cargo deny check
      # A REAL advisory fails. An unreachable service does not.
      #
      # npm's advisories endpoint went down for hours and took every
      # merge with it: `yarn npm audit` cannot tell "no vulnerabilities"
      # from "could not ask", and reported the outage as a supply-chain
      # failure. The registry answered in 0.09s throughout; only
      # `/-/npm/v1/security/advisories/bulk` was unreachable.
      #
      # Failing closed is the safer direction and still the wrong
      # answer: a check that could not run must say so rather than
      # blocking unrelated work. Same rule the package checks follow --
      # "no updates" and "the check did not run" are different facts.
      - name: Yarn audit
        shell: bash
        run: |
          set +e
          out=$(yarn npm audit --environment production --severity high 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ]; then
            exit 0
          fi
          # YN0001 with a socket/network error is the service being
          # unreachable, not a finding. Anything else is a real failure.
          # Two shapes, both meaning "the service did not answer".
          #
          # A connection-level failure (timeout, DNS, refused) and an
          # HTTP 5xx are the same fact to us: the audit did not run.
          # The first pass at this matched only the connection errors,
          # and the very next run of the same outage came back as
          # `YN0035: Service Unavailable (503)` -- Yarn had got a
          # response, just not an answer.
          if echo "$out" | grep -qE "Timeout awaiting|ENOTFOUND|ECONNREFUSED|ECONNRESET|EAI_AGAIN|socket hang up|Service Unavailable|Bad Gateway|Gateway Time-?out|Internal Server Error|Response Code: 5[0-9][0-9]"; then
            echo "::warning::npm's advisories endpoint was unreachable; the audit did not run."
            exit 0
          fi
          exit $code

  # Windows and Linux, deliberately NOT part of the jobs above.
  #
  # A `matrix` on `test-rust` would rename it to `test-rust (macos-latest)`,
  # and the branch protection ruleset requires the bare names -- every PR
  # would become unmergeable the moment this landed. Separate jobs keep the
  # required check names exactly as they are.
  #
  # These ARE required checks. The comment here used to say they were not
  # "yet", which was true when the jobs were first added and is now the
  # opposite of the live configuration -- corrected in #853 after reading
  # the ruleset rather than the comment.
  #
  # Verified against the API (`gh api repos/<owner>/<repo>/rulesets/<id>`),
  # which lists NINE required contexts on `main`:
  #   lint, test-frontend, test-rust, build, supply-chain,
  #   platform (ubuntu-latest), platform (windows-latest),
  #   mobile-android, mobile-ios
  #
  # Why this matters beyond tidiness, and why it is worth the words: a
  # required check that does not RUN blocks a merge forever. So anyone
  # adding a `paths:` filter to one of these jobs on the strength of the
  # old comment -- "not required, a skip is safe" -- would make every PR
  # that misses the filter unmergeable. The mobile jobs solve that
  # correctly and are the pattern to copy: the JOB always runs and
  # reports under its required name, and only its STEPS are conditional
  # (see `mobile-changes`, and `scripts/check-mobile-gate.py`, which is
  # the guard that keeps that wiring honest).
  platform:
    name: platform (${{ matrix.os }})
    strategy:
      # One platform failing must not cancel the other: when both are
      # broken, one run should tell you about both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri on Linux needs GTK and WebKit headers, and the tray needs
      # libayatana-appindicator specifically -- without it the app compiles
      # and the tray silently never appears, which is the hardest kind of
      # failure to attribute later.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Drop the third-party lists this project never installs
          # from, then refresh.
          #
          # A bare `apt-get update` refreshes EVERY configured source,
          # and the runner image ships a Google Chrome repository. When
          # that mirror serves a corrupted index the command exits 100
          # and the job dies on a fetch unrelated to the build:
          #
          #   E: Failed to fetch https://dl.google.com/linux/chrome-stable/...
          #      Hash Sum mismatch
          #
          # Seen on two unrelated pull requests across three runs in one
          # afternoon, blocking a release for an hour. See #713.
          #
          # Removing the Chrome list rather than disabling
          # `sources.list.d` wholesale: the first attempt at this used
          # `-o Dir::Etc::sourceparts=-`, which also disabled the
          # UNIVERSE list that lives there -- and every package below is
          # from universe, so the job then failed with "Unable to locate
          # package libwebkit2gtk-4.1-dev". Narrower is correct here.
          #
          # `|| true` so a runner image that stops shipping Chrome does
          # not fail on a missing file.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome* || true
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: ./.github/actions/setup

      - name: Rust tests
        shell: bash
        run: |
          (cd crates/headstate-stepup && cargo test)
          (cd src-tauri && cargo test)

      - name: Frontend tests
        shell: bash
        run: yarn vitest run

      - name: Clippy
        shell: bash
        run: |
          (cd crates/headstate-stepup && cargo clippy --all-targets -- -D warnings)
          (cd src-tauri && cargo clippy --all-targets -- -D warnings)

      - name: Build the app
        shell: bash
        run: yarn tauri build --no-bundle

  # Does this change touch anything a mobile job could possibly break?
  #
  # `mobile-android` (8.6 min measured avg) and `mobile-ios` (1.9 min) are
  # the first and sixth most expensive jobs here, and CI runs at least
  # TWICE per pull request -- once on push, once more per rebase, because
  # the ruleset sets `strict_required_status_checks_policy`. Most changes
  # cannot affect the phone at all, and paid ~9 minutes of the 7-13 minute
  # wall clock for that answer anyway.
  #
  # ---- Why this is a gate job and not `paths:` or a job-level `if:` ----
  #
  # Both of those SKIP the job, and a skipped job reports NO status. All
  # nine checks here are required by the `main` ruleset, including
  # `mobile-android` and `mobile-ios` -- so a skipped one does not mean
  # "passed", it means GitHub waits forever for a status that will never
  # arrive, and the pull request is unmergeable with no way to override
  # it from a branch. (The comment that used to sit here said these two
  # were "not a required check yet". They were promoted; that is exactly
  # what makes the naive fix a trap.)
  #
  # So the jobs always RUN and always report under their exact required
  # names. What is conditional is their STEPS. A job whose steps are all
  # skipped succeeds in about five seconds -- a real success, under the
  # real name, which is what the ruleset is waiting for.
  #
  # ---- Why plain git and not a paths-filter action ----
  #
  # Every third-party action here is pinned to a full commit SHA because
  # a tag is mutable (see the note at the top of this file). A filter is
  # a `git diff --name-only` and a `grep`; buying that with another
  # supply-chain entry to audit is the wrong trade.
  mobile-changes:
    runs-on: ubuntu-latest
    outputs:
      # "true" when the mobile jobs must do their real work.
      run: ${{ steps.filter.outputs.run }}
    steps:
      # `fetch-depth: 0` because the diff needs the merge base, and the
      # default depth-1 checkout has no history to find one in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether the mobile jobs have anything to check
        id: filter
        env:
          # Through `env:`, not interpolated into the script body. Both
          # are GitHub-controlled here (a SHA and a fixed event name), but
          # `${{ }}` inside `run:` is textual substitution -- it becomes
          # shell source before bash ever sees it -- so the habit is worth
          # keeping uniform rather than judged case by case.
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Anything that is NOT a pull request runs the full mobile
          # suite, no questions asked. That is `push` to main, a `v*`
          # tag, and `merge_group`.
          #
          # This is deliberate and it is the safe direction. A tag run is
          # what `release.yml` waits on, so a release must never be
          # cleared by a check that decided it had nothing to do. A
          # merge-group run exists precisely to compile this change
          # TOGETHER WITH the others merging beside it -- and "these
          # files did not change" is a statement about one branch, not
          # about the combined tree. Skipping there would discard the
          # only signal the queue is for.
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event is $EVENT, not a pull request; running the mobile jobs in full."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `...` (three dots) is the merge base, not a straight diff:
          # it asks "what did this branch change", so unrelated commits
          # that landed on main meanwhile do not count as this pull
          # request's changes.
          if ! CHANGED=$(git diff --name-only "$BASE"...HEAD); then
            echo "::warning::Could not diff against the base commit; running the mobile jobs in full."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Files changed:"
          echo "$CHANGED" | sed 's/^/  /'

          # WHAT COUNTS AS MOBILE CODE. Each line is here for a reason
          # that was checked by reading, not assumed. A false negative --
          # a mobile job skipped when it should have run -- is a phone
          # break merged with everything green, so every doubtful path is
          # IN.
          #
          #   src-mobile/       the companion crate itself, obviously.
          #
          #   crates/           `headstate-stepup` is a PATH dependency of
          #                     BOTH src-tauri and src-mobile: the step-up
          #                     canonical bytes, header grammar and
          #                     verifier live there and nowhere else
          #                     (#695). A change there changes what a
          #                     signature made on the phone has to satisfy.
          #
          #   src-tauri/src/remote/events.rs
          #   src-tauri/src/remote/surface.rs
          #                     The non-obvious ones, and the reason this
          #                     filter cannot just be "src-mobile plus
          #                     crates". src-mobile's tests `include_str!`
          #                     these two DESKTOP files at compile time --
          #                     `events.rs:496` and `surface.rs:205` -- to
          #                     compare the event allowlist and the surface
          #                     table against the desktop's as they are
          #                     checked in. `make test-mobile` is the only
          #                     thing that runs those comparisons. Leave
          #                     these out and a change to the desktop's
          #                     `EVENT_NAMES` skips the very job that
          #                     exists to catch it drifting -- which is a
          #                     page on the phone that never fills in, with
          #                     no error anywhere. (The third copy of the
          #                     allowlist, `src/api/transport.test.ts`, is
          #                     covered by `src/` below and by
          #                     `test-frontend`, which is unconditional.)
          #
          #   src/, index.html, public/, tsconfig*, vite.config.ts
          #                     The frontend is SHARED. `mobile-ios` ends
          #                     with `make mobile-frontend`, which is
          #                     `VITE_TARGET=mobile yarn build` -> `tsc -b
          #                     && vite build` over all of `src/`. That
          #                     build is the ONLY place the
          #                     `VITE_TARGET=mobile` half of the bundle is
          #                     compiled before a release tag. So `src/`
          #                     genuinely triggers, and it is why the
          #                     saving is a quarter of pull requests
          #                     rather than most of them -- measured: 7 of
          #                     the last 29 merged pull requests skip.
          #                     Including it is not caution, it is
          #                     correctness.
          #
          #   package.json, yarn.lock
          #                     That same Vite build installs from these,
          #                     and Dependabot opens pull requests that
          #                     touch nothing else.
          #
          #   Makefile          the mobile jobs are almost entirely
          #                     `make` targets: mobile-frontend,
          #                     lint-mobile, test-mobile,
          #                     check-mobile-ios, check-mobile-android,
          #                     deny-mobile, android-init.
          #
          #   scripts/          `make lint-mobile` shells out to
          #                     scripts/check-plugin-commands.py, the only
          #                     thing in CI that looks at the Kotlin at
          #                     all (#698).
          #
          #   .github/workflows/ci.yml, .github/actions/
          #                     the jobs themselves and the setup action
          #                     they share. A change to this file must
          #                     always test itself.
          if echo "$CHANGED" | grep -qE '^(src-mobile/|crates/|src/|scripts/|public/|\.github/actions/|src-tauri/src/remote/(events|surface)\.rs$|index\.html$|package\.json$|yarn\.lock$|tsconfig[^/]*\.json$|vite\.config\.ts$|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "Mobile-relevant paths changed; running the mobile jobs in full."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile-relevant paths changed; the mobile jobs will report success without doing work."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The mobile companion crate (`src-mobile`), on the two targets it ships
  # for.
  #
  # Linux carries the host-side gates (fmt, clippy, tests, cargo-deny) as
  # well as the Android cross-check, so a fresh clone with an NDK and this
  # file agree on what "the mobile crate passes" means.
  #
  # Every step below is gated on `mobile-changes`; see that job for why
  # the condition is on the steps and not on the job. `needs` does not
  # make this job skippable -- `mobile-changes` has no condition of its
  # own, so it always succeeds and this always runs.
  mobile-android:
    needs: mobile-changes
    runs-on: ubuntu-latest
    env:
      # Pinned rather than `$ANDROID_NDK_HOME`, which is whatever the
      # runner image calls its default that month. `sdkmanager` below is
      # a no-op while the image ships this version and an install when
      # it stops, so the toolchain is the same either way.
      NDK_VERSION: 27.3.13750724
      # Tauri's minimum Android SDK; the NDK ships one clang wrapper per
      # API level, and this picks the one matching the app's floor.
      ANDROID_API: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.mobile-changes.outputs.run == 'true'

      # The host-side steps (clippy, tests) compile the tauri crate for
      # Linux, which needs the WebKit and GTK headers. No appindicator:
      # phones have no tray and this crate does not enable it.
      - name: Linux system dependencies
        if: needs.mobile-changes.outputs.run == 'true'
        run: |
          # Drop the third-party lists this project never installs
          # from, then refresh.
          #
          # A bare `apt-get update` refreshes EVERY configured source,
          # and the runner image ships a Google Chrome repository. When
          # that mirror serves a corrupted index the command exits 100
          # and the job dies on a fetch unrelated to the build:
          #
          #   E: Failed to fetch https://dl.google.com/linux/chrome-stable/...
          #      Hash Sum mismatch
          #
          # Seen on two unrelated pull requests across three runs in one
          # afternoon, blocking a release for an hour. See #713.
          #
          # Removing the Chrome list rather than disabling
          # `sources.list.d` wholesale: the first attempt at this used
          # `-o Dir::Etc::sourceparts=-`, which also disabled the
          # UNIVERSE list that lives there -- and every package below is
          # from universe, so the job then failed with "Unable to locate
          # package libwebkit2gtk-4.1-dev". Narrower is correct here.
          #
          # `|| true` so a runner image that stops shipping Chrome does
          # not fail on a missing file.
          sudo rm -f /etc/apt/sources.list.d/*google-chrome* || true
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: ./.github/actions/setup
        if: needs.mobile-changes.outputs.run == 'true'
        with:
          rust-components: clippy, rustfmt
          rust-workspaces: src-mobile

      # The runner image ships the SDK and an NDK; this pins which NDK
      # and exports the variables the Tauri CLI and cc-rs read.
      #
      # `aws-lc-sys` compiles C and assembly through cc-rs, which finds an
      # Android compiler only by name on PATH (`aarch64-linux-android21-clang`
      # and friends) and otherwise fails with "failed to find tool", the
      # error #533 hit locally. Setting the per-target CC/AR variables is
      # the documented, deterministic form of the same thing.
      - name: Android NDK
        if: needs.mobile-changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/aarch64-linux-android$ANDROID_API-clang"
          {
            echo "NDK_HOME=$NDK_HOME"
            echo "ANDROID_NDK_HOME=$NDK_HOME"
            echo "ANDROID_NDK_ROOT=$NDK_HOME"
            echo "CC_aarch64_linux_android=aarch64-linux-android$ANDROID_API-clang"
            echo "CXX_aarch64_linux_android=aarch64-linux-android$ANDROID_API-clang++"
            echo "AR_aarch64_linux_android=llvm-ar"
            echo "RANLIB_aarch64_linux_android=llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android$ANDROID_API-clang"
          } >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

      - name: Rust target
        if: needs.mobile-changes.outputs.run == 'true'
        run: rustup target add aarch64-linux-android

      # `make lint-mobile` also runs scripts/check-plugin-commands.py, which
      # is the only thing in CI that looks at the Kotlin at all: this job
      # generates the Android Studio project but never runs Gradle, so no
      # .kt file is ever compiled. Tauri's PluginHandle dispatches on the
      # literal @Command method name with no case conversion, so a Kotlin
      # name that disagrees with what Rust invokes is a runtime failure on a
      # device and nothing at build time -- nearly shipped in #696 (#698).
      - name: Rust formatting, Clippy, and plugin command names
        if: needs.mobile-changes.outputs.run == 'true'
        run: make lint-mobile

      - name: Rust tests
        if: needs.mobile-changes.outputs.run == 'true'
        run: make test-mobile

      - name: Check the Android target
        if: needs.mobile-changes.outputs.run == 'true'
        run: make check-mobile-android

      # `gen/android` is the Android Studio project, committed like
      # `gen/apple` once it exists (see .gitignore). Nobody on this project
      # has an Android SDK locally yet, so the first run of this job
      # generates it and uploads it for the commit that checks it in;
      # once that lands this step reports "committed" and does nothing.
      - name: Android Studio project
        if: needs.mobile-changes.outputs.run == 'true'
        id: gen-android
        run: |
          set -euo pipefail
          if [ -d src-mobile/gen/android ]; then
            echo "src-mobile/gen/android is committed; nothing to generate."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            make android-init
            test -f src-mobile/gen/android/build.gradle.kts
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # The one step here with a condition of its own, so the mobile
        # gate is ANDed onto it rather than replacing it. If the steps
        # above did not run there is no generated project to upload, so
        # `generated` is empty and this would be false anyway -- the
        # first clause is belt and braces, and it keeps every step in
        # this job carrying the same visible gate.
        if: >-
          needs.mobile-changes.outputs.run == 'true'
          && steps.gen-android.outputs.generated == 'true'
        with:
          name: src-mobile-gen-android
          path: src-mobile/gen/android
          # The template writes a .gitignore for build products; it is
          # part of what gets committed.
          include-hidden-files: true
          if-no-files-found: error

      - name: Install cargo-deny
        if: needs.mobile-changes.outputs.run == 'true'
        run: cargo install cargo-deny --locked

      - name: cargo-deny
        if: needs.mobile-changes.outputs.run == 'true'
        run: make deny-mobile

  # `cargo check` for the iOS target only. Building the app archives and
  # exports, which needs a development team; the simulator run in #533 is
  # the proof the toolchain gives without one, and store builds stay
  # manual until the pairing walkthrough has passed twice.
  #
  # Gated on `mobile-changes` exactly like `mobile-android`; see that job
  # for why the condition sits on the steps. The `needs` is load-bearing
  # and not decoration: without it `needs.mobile-changes.outputs.run` is
  # the empty string rather than "true", every step's condition is false,
  # and this job reports a cheerful green having checked nothing at all,
  # forever. That is the precise false negative this whole change has to
  # avoid, so it is worth naming where it would happen.
  mobile-ios:
    needs: mobile-changes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.mobile-changes.outputs.run == 'true'
      - uses: ./.github/actions/setup
        if: needs.mobile-changes.outputs.run == 'true'
        with:
          rust-workspaces: src-mobile
      - name: Rust target
        if: needs.mobile-changes.outputs.run == 'true'
        run: rustup target add aarch64-apple-ios
      - name: Check the iOS target
        if: needs.mobile-changes.outputs.run == 'true'
        run: make check-mobile-ios
      # The mobile FRONTEND bundle, which nothing else in CI built. The
      # Rust jobs above deliberately do not need `dist/`, and
      # `yarn tsc -b` is target-agnostic, so the `VITE_TARGET=mobile`
      # half of the bundle -- `src/api/remote.ts`, the `select("mobile")`
      # branch, every mobile-only render path -- was first built by
      # `tauri ios build` in the RELEASE workflow, after tag and version
      # stamping. That is the most expensive place to discover a break.
      # Needs no simulator and no signing: it is a Vite build.
      - name: Build the mobile frontend
        if: needs.mobile-changes.outputs.run == 'true'
        run: make mobile-frontend
