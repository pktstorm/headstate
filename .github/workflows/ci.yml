name: CI

on:
  push:
    branches: [main]
    # Tags too: `release.yml` runs no tests of its own, and a tag ref is
    # neither a branch push nor a pull request -- so without this, tagging
    # published a build that nothing had linted, type-checked, or tested.
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag run: `release.yml` waits on it, and a cancelled
  # check would either block the release forever or wave it through.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; jobs needing more say so themselves.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs, not floating tags.
# A tag is mutable: whoever controls the action repo can repoint it at new
# code that then runs with this job's permissions. The trailing comment
# records which release each SHA is, since a bare SHA is unreadable.

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust-components: clippy, rustfmt
      - name: Privacy guard
        run: ./scripts/check-privacy.sh
      - name: Workflow shells
        run: python3 scripts/check-workflow-shells.py
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Typecheck
        run: yarn tsc -b --force
      - name: ESLint
        run: yarn eslint .
      - name: Knip
        run: yarn knip
      - name: Clippy
        shell: bash
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  test-rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: cargo test
      # Tests share a process, so state-touching changes can fail
      # intermittently. One green run does not prove a race is absent, but
      # ten full re-runs on every push stopped being free once real tests
      # landed (26 Rust tests as of this writing). Three total re-runs is a
      # deliberate trade: still catches the class of bug that failed about
      # one run in seven in a sibling project, without paying for a fixed
      # guess of "ten" on every push and PR forever. Bump this back up (or
      # move it to a scheduled job) if flakiness shows up that three runs
      # doesn't catch.
      - name: Race check
        working-directory: src-tauri
        run: |
          for i in $(seq 1 3); do
            cargo test --lib -- --test-threads=8 || { echo "FAILED ON ITERATION $i"; exit 1; }
          done

  test-frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Frontend tests
        shell: bash
        run: yarn vitest run

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Build the app bundle
        env:
          # Needed here too, not just in the release workflow: once
          # `tauri.conf.json` carries an updater public key, `tauri
          # build` refuses to produce a bundle without the matching
          # private key -- "A public key has been found, but no private
          # key". Found by this very job failing on the updater PR.
          #
          # Signing in CI also means the bundle this job builds is the
          # same shape the release builds, rather than a variant that
          # only compiles here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: yarn tauri build --bundles app

      # The release ships a UNIVERSAL binary, but this job builds native
      # arm64 only -- so an arch-gated link failure (plausible with bundled
      # SQLite or octocrab's crypto backends) passed every PR and would
      # first appear at tag time, after version stamping, during a release.
      #
      # `cargo check` rather than a second full build: it catches the
      # compile and link-configuration failures that differ by target
      # without doubling this job's runtime.
      - name: Check the Intel target the release also builds
        run: |
          rustup target add x86_64-apple-darwin
          cd src-tauri && cargo check --target x86_64-apple-darwin --all-targets

  supply-chain:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny
        working-directory: src-tauri
        run: cargo deny check
      - name: Yarn audit
        run: yarn npm audit --environment production --severity high

  # Windows and Linux, deliberately NOT part of the jobs above.
  #
  # A `matrix` on `test-rust` would rename it to `test-rust (macos-latest)`,
  # and the branch protection ruleset requires the bare names -- every PR
  # would become unmergeable the moment this landed. Separate jobs keep the
  # five required checks exactly as they are.
  #
  # Also NOT required checks yet, on purpose. These platforms have never
  # been built, so the first honest thing they can do is report. Promote
  # them in the ruleset once they are reliably green -- adding them as
  # required while red would block all work behind a port.
  platform:
    name: platform (${{ matrix.os }})
    strategy:
      # One platform failing must not cancel the other: when both are
      # broken, one run should tell you about both.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri on Linux needs GTK and WebKit headers, and the tray needs
      # libayatana-appindicator specifically -- without it the app compiles
      # and the tray silently never appears, which is the hardest kind of
      # failure to attribute later.
      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: ./.github/actions/setup

      - name: Rust tests
        shell: bash
        working-directory: src-tauri
        run: cargo test

      - name: Frontend tests
        shell: bash
        run: yarn vitest run

      - name: Clippy
        shell: bash
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the app
        shell: bash
        run: yarn tauri build --no-bundle
