# Scoped to macOS: the full cross-platform graph reports findings from
# GTK/X11/Windows crates that never compile here, and a permanently red
# gate is an ignored gate.
[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-apple-darwin" },
]

[advisories]
version = 2

# Each ignore is a deliberate, documented acceptance -- never a blanket mute.
# The gate still fails on anything NEW, which is the whole point of having it.
#
# RUSTSEC-2025-0081/0093/0094/0097/0098: the unic-* Unicode crates are
# unmaintained (the whole open-i18n/rust-unic project is). They reach us only
# through tauri-utils -> urlpattern, so we neither call them directly nor
# choose their version, and RustSec lists no safe upgrade. These are
# "unmaintained" notices, not vulnerabilities: no known exploit, no CVE.
# Revisit when Tauri moves urlpattern off unic (upstream is tracking a switch
# to icu_properties).
ignore = [
  "RUSTSEC-2025-0075",  # unic-char-range unmaintained
  "RUSTSEC-2025-0080",  # unic-common unmaintained
  "RUSTSEC-2025-0081",  # unic-char-property unmaintained
  "RUSTSEC-2025-0098",  # unic-ucd-version unmaintained
  "RUSTSEC-2025-0100",  # unic-ucd-ident unmaintained
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
