name: headstate-companion
options:
  bundleIdPrefix: com.pktstorm.headstate.companion
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Headstate Companion
      PRODUCT_BUNDLE_IDENTIFIER: com.pktstorm.headstate.companion
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  headstate-companion_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: headstate-companion_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: headstate-companion_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: headstate-companion_iOS/headstate-companion_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # Signing is driven by the environment so this generated project
        # stays generic and secret-free: a local `tauri ios build` sets
        # none of these and keeps Xcode's automatic behaviour, while the
        # release workflow exports all four (see mobile-release.yml).
        #
        # They live HERE, in the project, because nothing else survives.
        # `tauri ios build -- ARGS` sends trailing arguments to Cargo, and
        # XCODE_XCCONFIG_FILE is not honoured either -- with it exported,
        # the CLI's own xcodebuild still reported only
        # `Build settings from command line: SDKROOT`, so the four
        # settings never reached the build (#573, mobile-v0.1.4).
        # NOT a $(...) reference, unlike the three below. The Tauri CLI
        # reads CODE_SIGN_STYLE out of the project as a literal string to
        # build ExportOptions.plist, without asking Xcode to expand it,
        # and lowercases it -- so a reference here reaches exportArchive
        # verbatim and it rejects the build AFTER a successful compile:
        #
        #   error: exportArchive Unknown "signingStyle" specified
        #   "$(headstate_code_sign_style)". Must be either automatic or
        #   manual.
        #
        # (mobile-v0.1.5, where the archive itself built and signed.)
        # A literal is safe because manual signing is what this project
        # always wants: with no identity, team or profile set, Xcode
        # falls back to its own behaviour anyway, so a local unsigned
        # build is unaffected.
        # Carries Apple's export-compliance code into the Info.plist,
        # which references it as $(HEADSTATE_EXPORT_COMPLIANCE_CODE).
        # Declared HERE because Xcode expands Info.plist references from
        # BUILD SETTINGS, not from the environment: an exported variable
        # with no setting naming it resolves to nothing, which was
        # confirmed with `xcodebuild -showBuildSettings` before relying
        # on it. This line is what lets the release workflow supply the
        # value without committing it. Empty locally, and Apple treats an
        # empty code as absent.
        HEADSTATE_EXPORT_COMPLIANCE_CODE: $(HEADSTATE_EXPORT_COMPLIANCE_CODE)
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: $(HEADSTATE_DEVELOPMENT_TEAM)
        CODE_SIGN_IDENTITY: $(HEADSTATE_CODE_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(HEADSTATE_PROVISIONING_PROFILE)
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: TAURI_APP_PATH="${SRCROOT:?}/../.." yarn tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a