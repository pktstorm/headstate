[package]
name = "headstate-companion"
version = "0.1.0"
license = "Apache-2.0"
description = "Drive a paired desktop Headstate from your phone."
repository = "https://github.com/pktstorm/headstate"
edition = "2021"

# A SEPARATE crate with its own lockfile, not a member of a workspace with
# `src-tauri`. Two reasons, both about what must never end up in the phone
# binary (see docs/superpowers/specs/2026-09-05-mobile-companion-design.md,
# "Why Tauri mobile"):
#
# 1. The companion must not link octocrab, rusqlite, or any Docker or git
#    code. A workspace would not force that, but it would make it easy to
#    drift: one `headstate_lib` path dependency and the whole desktop comes
#    along. Standalone, the lock IS the proof -- `no_desktop_only_crates`
#    in lib.rs reads it.
# 2. Cargo unifies features across a workspace. The desktop pins rustls on
#    the `ring` provider (octocrab's choice); this crate needs `aws-lc-rs`
#    for X25519MLKEM768. Sharing a graph would compile both providers into
#    both apps and force rustls's explicit process-level default on the
#    desktop for no gain.
#
# The cost is a second lockfile and a second `cargo deny` run; both are
# wired into the Makefile.
#
# This crate IS the root of its own small workspace, so the in-repo
# plugins under `plugins/` share this lockfile and are covered by the
# same `cargo test --workspace`, `cargo clippy --workspace` and `cargo
# deny` runs. Everything above about what the lock proves applies to
# them too.
[workspace]
members = ["plugins/headstate-keys", "plugins/headstate-refresh"]

[lib]
name = "headstate_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to the same line as src-tauri/Cargo.toml so the two apps track one
# Tauri release. No `tray-icon`: phones have no tray.
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.33"
tauri-plugin-log = "2.9.0"
# HTTPS client for the paired desktop (#514 adds the pinned-fingerprint
# verifier and the client identity). `rustls` here means rustls on the
# aws-lc-rs provider -- reqwest 0.13 has no ring variant -- which is the
# only provider with X25519MLKEM768 key exchange, the reason the spec
# chose it. `json` for the command bodies. No native-tls: the platform
# TLS stack cannot present a client identity we control, and iOS has no
# OpenSSL to vendor.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Named directly so the provider choice is explicit and so #514 can set
# `CryptoProvider::install_default` without adding a dependency. Feature
# names match what reqwest enables, so nothing is compiled twice.
# TLS 1.3 only per the spec: no `tls12`.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
# Self-signed session certificate at pairing. On aws-lc-rs for the same
# reason as above: the default `ring` feature would compile a second
# crypto library into the phone.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# LAN discovery of the paired desktop (src/discovery.rs): browse for
# `_headstate._tcp` and match the TXT fingerprint prefix before trying the
# addresses stored at pairing. The same crate the desktop advertises with,
# so the record shape is agreed by construction. Pure Rust, so nothing to
# link on iOS beyond the entitlement the plist already declares. No
# `async`: `browse` is a blocking call the client runs on a blocking task.
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
# The opportunistic background refresh window on each platform (#516).
# In-repo: Swift and Kotlin sides live under plugins/headstate-refresh.
# The version is stated so the path dependency is not a wildcard for
# `cargo deny`.
tauri-plugin-headstate-refresh = { version = "0.1.0", path = "plugins/headstate-refresh" }
# The step-up signing keys in the Secure Enclave / Android Keystore and
# the TLS session identity (#513). In-repo: Swift and Kotlin sides live
# under plugins/headstate-keys. The version is stated so the path
# dependency is not a wildcard for `cargo deny`.
tauri-plugin-headstate-keys = { version = "0.1.0", path = "plugins/headstate-keys" }
